amcl:
  ros__parameters:
    use_sim_time: true
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: base_footprint
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: scan
    min_particles: 500
    max_particles: 2000


controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3


bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    default_bt_xml_filename: navigate_w_replanning_and_recovery.xml


velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity: [1.0, 0.0, 1.0]
    min_velocity: [-1.0, 0.0, -1.0]


map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: "/home/gagasaga/titan_ws/src/titan_nav/config/warehouse_map.yaml"


route_server:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    route_frame: map
    base_frame: base_footprint
    graph_file: /home/gagasaga/titan_ws/src/titan_nav/config/warehouse_graph_fixed.geojson
    max_node_search_radius: 3.0
    default_edge_cost: 1.0


global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true

      # Frames
      global_frame: map
      robot_base_frame: base_footprint
      transform_tolerance: 0.3

      # Robot geometry (pick ONE)
      robot_radius: 0.25
      # footprint: "[[0.3, 0.2], [0.3, -0.2], [-0.3, -0.2], [-0.3, 0.2]]"

      # Map behavior
      resolution: 0.05
      track_unknown_space: true
      rolling_window: false

      # Update / publish
      update_frequency: 5.0
      publish_frequency: 2.0
      expected_update_rate: 5.0
      always_send_full_costmap: true

      # Lifecycle safety
      clear_on_shutdown: true
      publish_voxel_map: false

      plugins:
        - static_layer
        - obstacle_layer
        - inflation_layer

      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true

      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: scan
          data_type: LaserScan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          observation_persistence: 0.0
          raytrace_range: 8.0
          obstacle_range: 6.0

      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        enabled: true
        inflation_radius: 0.6
        cost_scaling_factor: 10.0


local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true

      # Frames
      global_frame: odom
      robot_base_frame: base_footprint
      transform_tolerance: 0.2

      # Robot geometry
      robot_radius: 0.25
      # footprint: "[[0.3, 0.2], [0.3, -0.2], [-0.3, -0.2], [-0.3, 0.2]]"

      # Rolling window
      rolling_window: true
      width: 6.0
      height: 6.0
      resolution: 0.05

      # Update / publish
      update_frequency: 10.0
      publish_frequency: 5.0
      expected_update_rate: 10.0
      always_send_full_costmap: true

      # Lifecycle safety
      clear_on_shutdown: true
      publish_voxel_map: false

      plugins:
        - obstacle_layer
        - inflation_layer

      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: scan
          data_type: LaserScan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          observation_persistence: 0.0
          raytrace_range: 6.0
          obstacle_range: 5.0

      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        enabled: true
        inflation_radius: 0.5
        cost_scaling_factor: 10.0



lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: true
    autostart: true
