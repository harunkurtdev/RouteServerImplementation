amcl:
  ros__parameters:
    use_sim_time: true
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: base_footprint
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: scan
    min_particles: 500
    max_particles: 2000


controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    controller_plugins: ["FollowPath"]
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.5
      max_vel_y: 0.0
      max_vel_theta: 1.0
      min_speed_xy: 0.0
      max_speed_xy: 0.5
      min_speed_theta: 0.0
      acc_lim_x: 2.5
      acc_lim_y: 0.0
      acc_lim_theta: 3.2
      decel_lim_x: -2.5
      decel_lim_y: 0.0
      decel_lim_theta: -3.2
      vx_samples: 20
      vy_samples: 5
      vtheta_samples: 20
      sim_time: 1.7
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      short_circuit_trajectory_evaluation: true
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "ObstacleFootprint", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.5
      ObstacleFootprint.scale: 0.5
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0


planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true


behavior_server:
  ros__parameters:
    use_sim_time: true
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    wait:
      plugin: "nav2_behaviors::Wait"


bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    default_bt_xml_filename: navigate_w_replanning_and_recovery.xml


velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity: [1.0, 0.0, 1.0]
    min_velocity: [-1.0, 0.0, -1.0]


map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ""


route_server:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    route_frame: map
    base_frame: base_footprint
    graph_file: ""
    max_node_search_radius: 3.0
    default_edge_cost: 1.0


global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true

      # Frames
      global_frame: map
      robot_base_frame: base_footprint
      transform_tolerance: 0.3

      # Robot geometry (pick ONE)
      robot_radius: 0.25
      # footprint: "[[0.3, 0.2], [0.3, -0.2], [-0.3, -0.2], [-0.3, 0.2]]"

      # Map behavior
      resolution: 0.05
      track_unknown_space: true
      rolling_window: false

      # Update / publish
      update_frequency: 5.0
      publish_frequency: 2.0
      expected_update_rate: 5.0
      always_send_full_costmap: true

      # Lifecycle safety
      clear_on_shutdown: true
      publish_voxel_map: false

      plugins:
        - static_layer
        - obstacle_layer
        - inflation_layer

      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true

      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: scan
          data_type: LaserScan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          observation_persistence: 0.0
          raytrace_range: 8.0
          obstacle_range: 6.0

      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        enabled: true
        inflation_radius: 0.6
        cost_scaling_factor: 10.0


local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true

      # Frames
      global_frame: odom
      robot_base_frame: base_footprint
      transform_tolerance: 0.2

      # Robot geometry
      robot_radius: 0.25
      # footprint: "[[0.3, 0.2], [0.3, -0.2], [-0.3, -0.2], [-0.3, 0.2]]"

      # Rolling window
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05

      # Update / publish
      update_frequency: 10.0
      publish_frequency: 5.0
      expected_update_rate: 10.0
      always_send_full_costmap: true

      # Lifecycle safety
      clear_on_shutdown: true
      publish_voxel_map: false

      plugins:
        - obstacle_layer
        - inflation_layer

      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: scan
          data_type: LaserScan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          observation_persistence: 0.0
          raytrace_range: 6.0
          obstacle_range: 5.0

      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        enabled: true
        inflation_radius: 0.5
        cost_scaling_factor: 10.0



lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: true
    autostart: true
