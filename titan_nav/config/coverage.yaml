coverage_server:
  ros__parameters:
    use_sim_time: true

    # Robot parameters (VERY important)
    robot_width: 0.45              # meters
    operation_width: 0.45          # swath width
    min_turning_radius: 0.3
    linear_curv_change: 0.3

    # Coverage planning options
    default_swath_angle: 0.0
    headland_width: 0.0

    # Frame IDs
    map_frame: map
    robot_frame: base_footprint
