amcl:
  ros__parameters:
    use_sim_time: true

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 5.0
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"



# 🔥 THIS IS THE IMPORTANT PART (from demo)
bt_navigator:
  ros__parameters:
    use_sim_time: true

    navigator_plugins: ["navigate_complete_coverage"]

    navigate_complete_coverage:
      plugin: "opennav_coverage_navigator::CoverageNavigator"


waypoint_follower:
  ros__parameters:
    use_sim_time: true

behavior_server:
  ros__parameters:
    use_sim_time: true

velocity_smoother:
  ros__parameters:
    use_sim_time: true

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      plugins: ["voxel_layer", "inflation_layer"]

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: base_footprint
      resolution: 0.05
      plugins: ["static_layer", "inflation_layer"]
