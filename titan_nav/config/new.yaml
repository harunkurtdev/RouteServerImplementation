# =========================
# AMCL
# =========================
amcl:
  ros__parameters:
    use_sim_time: true
    base_frame_id: base_footprint
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: /scan
    min_particles: 500
    max_particles: 2000
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    update_min_d: 0.25
    update_min_a: 0.2
    resample_interval: 1
    transform_tolerance: 1.5


# =========================
# MAP SERVER
# =========================
map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename : "/home/gagasaga/titan_ws/src/titan_nav/config/warehouse_map.yaml"
    


# =========================
# PLANNER (kept but unused)
# =========================
planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 0.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      allow_unknown: true


# =========================
# CONTROLLER
# =========================
controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    controller_plugins: ["FollowPath"]

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      max_vel_x: 0.26
      max_vel_theta: 1.0
      acc_lim_x: 1.8
      acc_lim_theta: 2.0
      transform_tolerance: 0.2


# =========================
# COSTMAPS
# =========================
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: base_footprint
      resolution: 0.05
      plugins: ["static_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.6


local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      plugins: ["voxel_layer", "inflation_layer"]

      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          marking: true
          clearing: true

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.5


# =========================
# ROUTE SERVER (FIXED)
# =========================
route_server:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    route_frame: map
    base_frame: base_footprint
    graph_file: /home/gagasaga/titan_ws/src/titan_nav/config/warehouse_graph_fixed.geojson
    max_node_search_radius: 3.0
    default_edge_cost: 1.0


# =========================
# BT NAVIGATOR (ROUTE-ONLY)
# =========================
bt_navigator:
  ros__parameters:
    use_sim_time: true
    # default_nav_to_pose_bt_xml: /home/gagasaga/titan_ws/src/titan_nav/config/route_nav.xml

   


# =========================
# LIFECYCLE MANAGER (CRITICAL FIX)
# =========================
lifecycle_manager:
  ros__parameters:
    autostart: true
    node_names:
      - map_server
      - amcl
      - global_costmap
      - local_costmap
      - route_server
      - controller_server
      - planner_server
      - bt_navigator
